[package]
name = "caffeineai-user-approval"
version = "1.2.0"
description = "Approval-based user management with member invite links."
license = "Apache-2.0"
repository = "https://github.com/caffeinelabs/skills"
keywords = ["motoko", "icp"]

[dependencies]
core = "2.5.0"
caffeineai-authorization = "../../authorization/backend"

[dev-dependencies]
test = "2.1.2"

[toolchain]
moc = "1.7.0"
mo-fmt = "0.4.0"
pocket-ic = "14.0.0"

[moc]
args = ["--default-persistent-actors"]
